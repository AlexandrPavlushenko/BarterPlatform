{% extends 'base.html' %}
{% load static %}

{% block title %}Редактировать профиль{% endblock title %}

{% block content %}
    <div class="column left-column"></div>
    <div class="column middle-column d-flex justify-content-center align-items-start" style="height: 94vh;">
        <div class="text-container w-50 mt-5">
            <h1 class="custom-font1 gradient-text">Редактировать профиль</h1>

            <form id="profile-form" method="post" enctype="multipart/form-data" action="{% url 'users:profile' %}">
                {% csrf_token %}

                <!-- Аватар -->
                <div class="mb-4">
                    <label class="form-label"
                           style="font-size: 20px;font-family: Arsenal, sans-serif; color: dimgray">
                        Аватар профиля
                    </label>

                    <div class="image-upload-container text-center">
                        <div class="image-wrapper ratio-1-1">
                            {% if user.avatar %}
                                <img src="{{ user.avatar.url }}"
                                     id="current-avatar"
                                     class="img-preview rounded-circle"
                                     alt="Текущий аватар">
                            {% endif %}
                            <img src="" id="avatar-preview" class="img-preview rounded-circle" style="display: none;">
                            <div id="no-avatar" class="no-image-placeholder rounded-circle"
                                 style="{% if user.avatar %}display: none;{% endif %}">
                                <i class="fas fa-user" style="font-size: 3rem; color: #ddd;"></i>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-3">
                            <input type="file" name="avatar" id="id_avatar" accept="image/*" style="display: none;">
                            <input type="hidden" name="redirect_to" value="ad_list">

                            <button type="button" class="upload-btn"
                                    onclick="document.getElementById('id_avatar').click()">
                                <i class="fas fa-camera me-2"></i>Выбрать
                            </button>

                            <button type="button" id="remove-avatar-btn" class="btn btn-outline-danger"
                                    {% if not user.avatar %}style="display: none;"{% endif %}>
                                <i class="fas fa-trash me-2"></i>Удалить
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Основные поля -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="id_first_name" class="form-label">
                                Имя
                            </label>
                            <input type="text" name="first_name" id="id_first_name" class="form-control"
                                   value="{{ form.first_name.value|default:'' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="id_last_name" class="form-label">
                                Фамилия
                            </label>
                            <input type="text" name="last_name" id="id_last_name" class="form-control"
                                   value="{{ form.last_name.value|default:'' }}">
                        </div>
                    </div>
                </div>

                <!-- Контакты -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="id_phone" class="form-label">
                                Телефон
                            </label>
                            <input type="text" name="phone" id="id_phone" class="form-control"
                                   value="{{ form.phone.value|default:'' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="id_city" class="form-label">
                                Город
                            </label>
                            <input type="text" name="city" id="id_city" class="form-control"
                                   value="{{ form.city.value|default:'' }}">
                        </div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <button type="submit" class="custom-button-sm mb-3" style="font-family: Arsenal, sans-serif">
                        Сохранить
                    </button>
                </div>
                <a href="{% url 'ads:ad_list' %}" class="forgot-password-link">
                    <i class="fas fa-arrow-left me-2"></i>Назад
                </a>
            </form>
        </div>
    </div>
    <div class="column right-column"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const avatarInput = document.getElementById('id_avatar');
            const currentAvatar = document.getElementById('current-avatar');
            const avatarPreview = document.getElementById('avatar-preview');
            const noAvatar = document.getElementById('no-avatar');
            const removeBtn = document.getElementById('remove-avatar-btn');
            const form = document.getElementById('profile-form');

            // Обработка выбора нового изображения
            avatarInput.addEventListener('change', function () {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        avatarPreview.src = e.target.result;
                        avatarPreview.style.display = 'block';
                        if (currentAvatar) currentAvatar.style.display = 'none';
                        noAvatar.style.display = 'none';
                        removeBtn.style.display = 'inline-block';
                    };
                    reader.readAsDataURL(this.files[0]);
                }
            });

            // Удаление аватара
            removeBtn.addEventListener('click', function () {
                if (currentAvatar) currentAvatar.style.display = 'none';
                avatarPreview.style.display = 'none';
                noAvatar.style.display = 'flex';
                this.style.display = 'none';
                avatarInput.value = '';

                // Создаем скрытое поле для удаления аватара
                const existingClear = document.querySelector('input[name="avatar-clear"]');
                if (!existingClear) {
                    const clearInput = document.createElement('input');
                    clearInput.type = 'hidden';
                    clearInput.name = 'avatar-clear';
                    clearInput.value = '1';
                    form.appendChild(clearInput);
                }
            });
        });
    </script>

{% endblock content %}
