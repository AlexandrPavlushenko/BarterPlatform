{% extends 'base.html' %}
{% load static %}

{% block title %}Сброс пароля{% endblock title %}

{% block content %}

    <div class="column left-column"></div>
    <div class="column middle-column d-flex justify-content-center align-items-start" style="height: 94vh;">
        <div class="text-container w-50 mt-5">
            <p class="custom-font1 gradient-text">Сброс пароля</p>
            {% if messages %}
                <div class="alert alert-warning" role="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                    <p style="font-size: 24px; color: dimgray;font-family: Arsenal, sans-serif">Пожалуйста, введите
                        новый пароль.</p>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label"
                               style="font-size: 20px; font-family: Arsenal, sans-serif; color: dimgray;">
                            Новый пароль
                        </label>
                        <input type="password" name="password1" id="id_password1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password2" class="form-label"
                               style="font-size: 20px; font-family: Arsenal, sans-serif; color: dimgray;">
                            Подтверждение нового пароля
                        </label>
                        <input type="password" name="password2" id="id_password2" class="form-control" required>
                    </div>
                <div class="card-footer text-center">
                    <button type="submit" class="custom-button custom-font2">Сбросить пароль</button>
                </div>
            </form>
        </div>
    </div>
    <div class="column right-column"></div>
{% endblock content %}
